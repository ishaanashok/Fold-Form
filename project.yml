name: FoldForm
options:
  bundleIdPrefix: com.ishaanashok
  deploymentTarget:
    iOS: "27.1"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "27.1"
targets:
  FoldForm:
    type: application
    platform: iOS
    sources:
      - path: FoldForm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ishaanashok.FoldForm
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
  FoldFormTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FoldFormTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ishaanashok.FoldFormTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: FoldForm
schemes:
  FoldForm:
    build:
      targets:
        FoldForm: all
        FoldFormTests: [test]
    test:
      targets:
        - FoldFormTests
    run:
      config: Debug
